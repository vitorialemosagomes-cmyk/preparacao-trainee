<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Preparação Trainee</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 80'%3E%3Cg fill='%23E23B85'%3E%3Cellipse rx='13' ry='26' cy='-17'/%3E%3Cellipse rx='13' ry='26' cy='-17' transform='rotate(72)'/%3E%3Cellipse rx='13' ry='26' cy='-17' transform='rotate(144)'/%3E%3Cellipse rx='13' ry='26' cy='-17' transform='rotate(216)'/%3E%3Cellipse rx='13' ry='26' cy='-17' transform='rotate(288)'/%3E%3C/g%3E%3Ccircle r='11' fill='%23FFC233'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,0..100;1,9..144,500..700,0..100&display=swap">
<style id="gate-style">
:root{
  --hero-bg:#C81D6C;--hero-bg2:#E23B85;--hero-ink:#FFFFFF;--hero-muted:#FFE1EE;
  --field-bg:#FFFFFF;--field-ink:#2B1B24;--field-line:rgba(255,255,255,.55);--btn:#FFC233;--btn-ink:#2B1B24;--warn:#FFF3C9;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--hero-bg:#8E1449;--hero-bg2:#B41D60;--hero-muted:#FFD3E5;--field-bg:#22141D;--field-ink:#FFF1F6;--field-line:rgba(255,255,255,.35);--btn:#FFCF4D;--btn-ink:#1A0F16;color-scheme:dark}
}
html,body{height:100%}
body{margin:0;background:radial-gradient(640px 420px at 50% 32%,var(--hero-bg2),transparent 70%),var(--hero-bg);color:var(--hero-ink);font:15px/1.5 var(--font-body)}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px 16px;text-align:center;overflow:auto}
.gate svg{display:block;width:min(360px,76vw);height:auto;overflow:visible}
.gate h1{margin:4px 0 0;font:800 clamp(30px,7vw,46px)/1.05 var(--font-display);font-variation-settings:"SOFT" 100;letter-spacing:-.02em}
.gate h1 em{font-style:italic;font-weight:600}
.busy{margin:0;font-size:13.5px;font-weight:600;color:var(--hero-muted)}
form{display:grid;gap:10px;width:min(320px,100%);margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=password]{box-sizing:border-box;width:100%;font:600 16px/1.2 var(--font-body);padding:13px 16px;border-radius:999px;border:2px solid var(--field-line);background:var(--field-bg);color:var(--field-ink);outline:none;text-align:center;letter-spacing:.04em}
input[type=password]:focus-visible{border-color:var(--btn);box-shadow:0 0 0 4px rgba(255,194,51,.35)}
.go{appearance:none;border:0;border-radius:999px;padding:13px 18px;font:800 16px/1 var(--font-body);background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.remember{display:inline-flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--hero-muted);cursor:pointer}
.remember input{width:17px;height:17px;accent-color:var(--btn)}
.msg{margin:0;min-height:1.4em;font-size:14px;font-weight:700;color:var(--warn)}
.sp-sun,.sp-leaf,.sp-bloom{transform-box:fill-box;transform-origin:center}
.sp-sun{animation:spRise .9s cubic-bezier(.2,.8,.2,1) both}
.sp-leaf{animation:spGrow .7s cubic-bezier(.2,.8,.2,1) both,spSway 2.6s 1s ease-in-out infinite alternate}
.sp-bloom{animation:spBloom .8s cubic-bezier(.25,1.35,.45,1) both}
.sp-dot{animation:spTwinkle 1.4s ease-in-out infinite alternate}
.gate h1{animation:spFade .6s .5s ease-out both}
form,.busy{animation:spFade .6s .75s ease-out both}
@keyframes spRise{from{opacity:0;transform:translateY(22px) scale(.9)}to{opacity:1;transform:none}}
@keyframes spGrow{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes spSway{from{transform:rotate(0)}to{transform:rotate(5deg)}}
@keyframes spBloom{from{opacity:0;transform:scale(0) rotate(-70deg)}to{opacity:1;transform:none}}
@keyframes spTwinkle{from{opacity:.25}to{opacity:1}}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="gate" id="gate">
  <svg viewBox="0 0 320 230" fill="none" aria-hidden="true">
    <g class="sp-sun"><circle cx="160" cy="104" r="74" fill="#FF7A1C"/><circle cx="160" cy="104" r="50" fill="#FFC233"/></g>
    <g transform="translate(92 170) rotate(-34)"><g class="sp-leaf" style="animation-delay:.15s,1s"><ellipse rx="66" ry="22" fill="#16A05A"/><path d="M-60 0H60" stroke="#0B6B3B" stroke-width="3"/></g></g>
    <g transform="translate(234 172) rotate(30)"><g class="sp-leaf" style="animation-delay:.25s,1.3s"><ellipse rx="58" ry="20" fill="#0FB3AE"/><path d="M-52 0H52" stroke="#086E6B" stroke-width="3"/></g></g>
    <g transform="translate(58 98) rotate(-66)"><g class="sp-leaf" style="animation-delay:.35s,1.15s"><ellipse rx="44" ry="15" fill="#16A05A"/><path d="M-39 0H39" stroke="#0B6B3B" stroke-width="2.5"/></g></g>
    <g transform="translate(266 86) rotate(60)"><g class="sp-leaf" style="animation-delay:.4s,1.45s"><ellipse rx="40" ry="14" fill="#3A55E0"/><path d="M-35 0H35" stroke="#2635A6" stroke-width="2.5"/></g></g>
    <g transform="translate(160 104)"><g class="sp-bloom" style="animation-delay:.3s"><ellipse rx="15" ry="34" cy="-27" fill="#FFE4F0"/><ellipse rx="15" ry="34" cy="-27" fill="#FFE4F0" transform="rotate(72)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFE4F0" transform="rotate(144)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFE4F0" transform="rotate(216)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFE4F0" transform="rotate(288)"/><circle r="14" fill="#FFC233"/></g></g>
    <g transform="translate(236 150) scale(.6)"><g class="sp-bloom" style="animation-delay:.55s"><ellipse rx="15" ry="34" cy="-27" fill="#FFFFFF"/><ellipse rx="15" ry="34" cy="-27" fill="#FFFFFF" transform="rotate(72)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFFFFF" transform="rotate(144)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFFFFF" transform="rotate(216)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFFFFF" transform="rotate(288)"/><circle r="14" fill="#FF7A1C"/></g></g>
    <g transform="translate(86 146) scale(.52)"><g class="sp-bloom" style="animation-delay:.7s"><ellipse rx="15" ry="34" cy="-27" fill="#FFC233"/><ellipse rx="15" ry="34" cy="-27" fill="#FFC233" transform="rotate(72)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFC233" transform="rotate(144)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFC233" transform="rotate(216)"/><ellipse rx="15" ry="34" cy="-27" fill="#FFC233" transform="rotate(288)"/><circle r="14" fill="#FFFFFF"/></g></g>
    <circle class="sp-dot" cx="38" cy="40" r="4" fill="#FFC233"/><circle class="sp-dot" cx="286" cy="30" r="3.5" fill="#FFFFFF" style="animation-delay:.4s"/><circle class="sp-dot" cx="300" cy="140" r="4.5" fill="#FFC233" style="animation-delay:.8s"/><circle class="sp-dot" cx="22" cy="150" r="3.5" fill="#FFFFFF" style="animation-delay:.2s"/><circle class="sp-dot" cx="160" cy="214" r="4" fill="#FFFFFF" style="animation-delay:.6s"/>
  </svg>
  <h1>Preparação <em>Trainee</em></h1>
  <form id="f" autocomplete="on" hidden>
    <input type="text" name="username" autocomplete="username" value="preparacao-trainee" hidden>
    <label for="pw" class="sr">Senha</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button type="submit" class="go">Entrar</button>
    <label class="remember"><input type="checkbox" id="rem"> Lembrar neste aparelho</label>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="busy" id="busy">Abrindo suas anotações…</p>
  <noscript><p class="msg">Ative o JavaScript para abrir a página.</p></noscript>
</main>

<script>
(function(){
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEYS = 'pt-gh-keys-v1';
  var te = new TextEncoder(), td = new TextDecoder();
  var form = document.getElementById('f'), pw = document.getElementById('pw'), rem = document.getElementById('rem');
  var msg = document.getElementById('msg'), busy = document.getElementById('busy');

  function b64(u8){ var s=''; for(var i=0;i<u8.length;i+=0x8000){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); } return btoa(s); }
  function unb64(s){ var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function showForm(text){ busy.hidden = true; form.hidden = false; msg.textContent = text || ''; try{ pw.focus(); }catch(e){} }
  function showBusy(){ form.hidden = true; busy.hidden = false; }

  /* a partir da v2, maiúsculas e espaços não importam na senha */
  function norm(p){ return P.norm ? String(p).normalize('NFC').toLowerCase().replace(/\s+/g, '') : String(p); }
  async function derive(password){
    var base = await crypto.subtle.importKey('raw', te.encode(norm(password)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:unb64(P.salt), iterations:P.iter }, base, 512));
  }
  function aad(doc){ return te.encode('fichario/' + doc); }
  function makeSeal(key){
    return async function(doc, obj){
      var iv = crypto.getRandomValues(new Uint8Array(12));
      var ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv:iv, additionalData:aad(doc) }, key, te.encode(JSON.stringify(obj))));
      var out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12); return b64(out);
    };
  }
  function makeOpen(key){
    return async function(doc, s){
      var u = unb64(s);
      var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:u.subarray(0,12), additionalData:aad(doc) }, key, u.subarray(12));
      return JSON.parse(td.decode(pt));
    };
  }
  /* PDFs da aba Materiais: mesma chave das respostas, com o dado extra "materiais/<id>" */
  function makeOpenBin(key){
    return async function(id, u8){
      return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:u8.subarray(0,12), additionalData:te.encode('materiais/' + id) }, key, u8.subarray(12)));
    };
  }
  /* primeira vez: leva as respostas que já estavam na página do Claude */
  async function migrate(sb, uid, seal, seed){
    /* junta o que veio da página do Claude com o que já estava neste navegador; o navegador vence */
    var local = {};
    try{ local = JSON.parse(localStorage.getItem('fichario-trainee-itau-v1') || '{}') || {}; }catch(e){ local = {}; }
    var docs = {};
    [seed || {}, local].forEach(function(src){
      Object.keys(src).forEach(function(doc){
        var d = src[doc];
        if(d && typeof d === 'object' && Object.keys(d).length) docs[doc] = Object.assign(docs[doc] || {}, d);
      });
    });
    if(!Object.keys(docs).length) return;
    try{
      var c = await sb.from('fichario').select('doc', { count:'exact', head:true });
      if(c.error || c.count !== 0) return;
      var rows = [], now = new Date().toISOString();
      for(var doc in docs){
        rows.push({ user_id:uid, doc:doc, data:await seal(doc, docs[doc]), updated_at:now });
      }
      if(rows.length){ var r = await sb.from('fichario').upsert(rows, { onConflict:'user_id,doc' }); if(r.error) console.warn('Migração:', r.error); }
    }catch(e){ console.warn('Migração:', e); }
  }
  function mount(html){
    var d = new DOMParser().parseFromString(html, 'text/html');
    var gs = document.getElementById('gate-style'); if(gs) gs.parentNode.removeChild(gs);
    document.title = d.title || document.title;
    var scripts = Array.prototype.slice.call(d.querySelectorAll('script'));
    scripts.forEach(function(s){ s.parentNode.removeChild(s); });
    Array.prototype.slice.call(d.head.childNodes).forEach(function(n){ if(n.nodeType === 1) document.head.appendChild(document.importNode(n, true)); });
    document.body.innerHTML = d.body.innerHTML;
    scripts.forEach(function(s){ var n = document.createElement('script'); n.text = s.textContent; document.body.appendChild(n); });
  }
  /* devolve true (abriu), false (senha errada) ou 'need-password' (chave lembrada, mas o login do banco expirou) */
  async function start(bits, password, remember){
    var pageKey = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['decrypt']);
    var app;
    try{ app = JSON.parse(td.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(P.iv) }, pageKey, unb64(P.ct)))); }
    catch(e){ return false; }
    /* a chave das respostas vem dentro da página (não muda quando a senha muda); nas versões antigas, vinha da senha */
    var dataKey = await crypto.subtle.importKey('raw', app.dataKey ? unb64(app.dataKey) : bits.slice(32,64), 'AES-GCM', false, ['encrypt','decrypt']);
    var cfg = app.cfg || {};
    var boot = { remember:remember, seal:makeSeal(dataKey), open:makeOpen(dataKey), openBin:makeOpenBin(dataKey) };
    if(window.supabase && cfg.url && cfg.key){
      var sb = window.supabase.createClient(cfg.url, cfg.key, { auth:{ persistSession:remember, autoRefreshToken:true, detectSessionInUrl:false, storageKey:'pt-gh-auth' } });
      boot.sb = sb;
      var session = null;
      try{ var g = await sb.auth.getSession(); session = g && g.data ? g.data.session : null; }catch(e){}
      if(!session){
        var authPw = cfg.authPassword || password;
        if(!authPw) return 'need-password';
        try{
          var s = await sb.auth.signInWithPassword({ email:cfg.email, password:authPw });
          if(s.error){ boot.authError = s.error.message || 'erro'; boot.authCode = s.error.code || (s.error.status ? 'http_' + s.error.status : ''); }
          else session = s.data.session;
        }catch(e){ boot.authError = String((e && e.message) || e); boot.authCode = 'network'; }
      }
      if(session && session.user){ boot.userId = session.user.id; await migrate(sb, session.user.id, boot.seal, app.seed); }
    }
    try{ if(remember) localStorage.setItem(KEYS, b64(bits)); else localStorage.removeItem(KEYS); }catch(e){}
    window.__PT_BOOT = boot;
    mount(app.html);
    return true;
  }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var p = pw.value; if(!p) return;
    showBusy();
    var r;
    try{ r = await start(await derive(p), p, rem.checked); }catch(e){ console.error(e); r = 'error'; }
    if(r === true) return;
    showForm(r === false ? 'Senha incorreta.' : 'Não consegui abrir. Tente de novo.');
    pw.select();
  });

  (async function init(){
    if(!(window.crypto && crypto.subtle)){ showForm('Este navegador não consegue abrir a página. Use o Chrome, o Safari ou o Edge atualizados.'); return; }
    var saved = null; try{ saved = localStorage.getItem(KEYS); }catch(e){}
    if(saved){
      var r = false;
      try{ r = await start(unb64(saved), null, true); }catch(e){ console.error(e); r = false; }
      if(r === true) return;
      if(r === 'need-password'){ rem.checked = true; showForm('Digite a senha para voltar a sincronizar.'); return; }
      try{ localStorage.removeItem(KEYS); }catch(e){}
    }
    showForm('');
  })();
})();
</script>
